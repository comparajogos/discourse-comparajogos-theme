name: Discourse Theme

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  color-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/sync-colors.mjs --check

  splash-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-splash.mjs

  ci:
    uses: discourse/.github/.github/workflows/discourse-theme.yml@v1
