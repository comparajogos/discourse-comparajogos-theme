show_header_nav:
  default: true
  description:
    en: "Show the Compara Jogos cross-product navigation in the forum header."
    pt_BR: "Mostra a navegação do Compara Jogos no cabeçalho do fórum."

header_logo_links_to_product:
  default: true
  description:
    en: "Point the header logo at the Compara Jogos catalog, as the client's header does."
    pt_BR: "Faz o logo do cabeçalho apontar para o catálogo do Compara Jogos, como no cliente."

profile_bridge:
  default: true
  description:
    en: "Show a member's public Compara Jogos activity and list links on their forum profile and user card."
    pt_BR: "Mostra a atividade pública e as listas do Compara Jogos no perfil e no cartão de usuário do fórum."

unified_profile_shell:
  default: false
  description:
    en: "Use the shared member tabs and make the catalog Summary the canonical profile landing page. Enable only after the client-side profile shell is deployed."
    pt_BR: "Usa as abas compartilhadas do perfil e torna o Resumo do catálogo a página inicial canônica. Ative somente depois de publicar o cabeçalho de perfil no cliente."

topic_list_feed:
  default: true
  description:
    en: "Show discovery lists as feed rows — author, title, engagement, last reply — instead of a column table."
    pt_BR: "Mostra as listas como linhas de feed — autor, título, engajamento, última resposta — em vez de tabela."

show_mobile_tab_bar:
  default: true
  description:
    en: "Style and reserve first-paint space for the Compara Jogos mobile tab-bar component. Disable when that component is not installed."
    pt_BR: "Estiliza e reserva espaço inicial para o componente da barra móvel do Compara Jogos. Desative quando o componente não estiver instalado."

show_category_rail_skeleton:
  default: false
  description:
    en: "Reserve first-paint space for the Compara Jogos Category Carousel component. Enable only when that component is installed."
    pt_BR: "Reserva espaço inicial para o componente Compara Jogos Category Carousel. Ative apenas quando o componente estiver instalado."

mobile_header_search:
  default: true
  description:
    en: "Keep the search field in the header on mobile and narrow desktop, collapsed to a button and expanding on focus, as the client does. Core leaves it out at those widths and shows a dropdown icon instead."
    pt_BR: "Mantém o campo de busca no cabeçalho no mobile, recolhido como botão e expandindo ao focar, como no cliente."

product_url:
  default: "https://www.comparajogos.com.br"
  type: string
  description:
    en: "Compara Jogos catalog URL, used by the header nav and the logo."
    pt_BR: "Endereço do catálogo, usado pela navegação do cabeçalho e pelo logo."

splash_logo:
  default: "https://uploads.comparajogos.com.br/original/3X/e/5/e58b246bf3a4d58648b88afb04535dd9d0a6c493.png"
  type: string
  description:
    en: "Logo painted on the loading skeleton in the light scheme. Point it at the same image as the site logo — the skeleton is the header the visitor is about to see. Leave empty to paint no logo."
    pt_BR: "Logo exibido no esqueleto de carregamento no esquema claro. Use a mesma imagem do logo do site. Deixe vazio para não exibir logo."

splash_logo_dark:
  default: "https://uploads.comparajogos.com.br/original/3X/0/2/02f4d56d7d6f1d7ef3e3c6b44617e09921d3ce93.png"
  type: string
  description:
    en: "Logo painted on the loading skeleton in the dark scheme. Same rule as splash_logo."
    pt_BR: "Logo exibido no esqueleto de carregamento no esquema escuro. Mesma regra do splash_logo."

hidden_filter_tags:
  default: "ficha|imagem"
  type: string
  description:
    en: "Tags to leave out of the discovery tag filter, separated by `|`. They stay usable on topics and in the composer — this only removes them from the filter's list. Empty to show every tag."
    pt_BR: "Etiquetas que não aparecem no filtro de etiquetas da listagem, separadas por `|`. Continuam válidas nos tópicos e no editor — isto só as remove da lista do filtro. Vazio para mostrar todas."

category_rail_blurb:
  default: "Escolha uma categoria para filtrar."
  type: string
  description:
    en: "One line shown under the category rail while no category is selected, in place of the selected category's description. Keep it to one line: both states are clamped to the same height so the list never shifts. Empty to show nothing (the rail then changes height between states)."
    pt_BR: "Uma linha exibida sob a trilha de categorias enquanto nenhuma está selecionada, no lugar da descrição da categoria. Mantenha em uma linha: os dois estados têm a mesma altura para a lista não pular. Vazio para não exibir nada."

game_card_tag_page:
  default: true
  description:
    en: "Show the game's card above a tag's topic list. A tag that the catalog does not know as a game shows nothing."
    pt_BR: "Mostra o card do jogo acima da lista de tópicos da etiqueta. Etiquetas que o catálogo não conhece como jogo não exibem nada."

game_card_topic_rail:
  default: true
  description:
    en: "Show the games a topic is filed under as a scrollable strip above the posts."
    pt_BR: "Mostra os jogos aos quais o tópico está vinculado em uma faixa rolável acima das mensagens."

game_card_mentions:
  default: true
  description:
    en: "Open the game's card when a `#tag` mention in a post or chat message is tapped. Mentions of tags that are not games keep their normal link."
    pt_BR: "Abre o card do jogo ao tocar em uma menção `#etiqueta` em uma mensagem ou no chat. Menções de etiquetas que não são jogos mantêm o link normal."

game_card_graphql_url:
  default: "https://api.comparajogos.com.br/v1/graphql"
  type: string
  description:
    en: "Compara Jogos GraphQL endpoint the cards read. Queried anonymously; no credentials are sent."
    pt_BR: "Endereço GraphQL do Compara Jogos usado pelos cards. Consultado anonimamente, sem credenciais."

game_card_ignored_tags:
  default: "ficha|imagem|video|arquivo"
  type: string
  description:
    en: "Tags that are markers rather than games, separated by `|`. They are never looked up in the catalog, so they never show a card and never lose their link. Any other tag is looked up once per session and remembered either way."
    pt_BR: "Etiquetas que são marcadores, não jogos, separadas por `|`. Nunca são consultadas no catálogo, então nunca exibem card nem perdem o link. Qualquer outra etiqueta é consultada uma vez por sessão e memorizada."
