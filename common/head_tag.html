  html #d-splash {
    --cj-shell-frame-start: max(2.5rem, calc((100vw - 85rem) / 2));
    --cj-shell-main-start: calc(var(--cj-shell-frame-start) + 14.625rem);

    /*
     * Geometry, measured off the booted page with `overflow: hidden` — the
     * condition the splash paints under, where 100vw equals the layout width.
     * Named so one edit moves every dependent offset, and so the numbers can be
     * checked against the real thing instead of being folded into gradients.
     *
     *   sidebar row      36px tall on a 48px pitch, first row at y=128
     *   discovery card  ~152px tall on a 164px pitch, first card at y=207
     */
    --cj-shell-row-h: 2.25rem;
    --cj-shell-row-pitch: 3rem;
    --cj-shell-sidebar-top: 8rem;
    --cj-shell-sidebar-rows: 2;
    --cj-shell-card-h: 9.5rem;
    --cj-shell-card-pitch: 10.25rem;
    --cj-shell-content-top: 12.9375rem;
    position: fixed;
    display: block;
    overflow: hidden;
    background: var(--cj-initial-background);
  }

  html #d-splash::before {
    position: absolute;
    z-index: 1;
    inset-block-start: 1.5rem;
    inset-inline: var(--cj-shell-frame-start);
    height: 4.5rem;
    background:
      var(--cj-initial-logo) 1rem center / 9.0725rem 2.5rem no-repeat,
      var(--cj-initial-panel);
    border: 1px solid var(--cj-initial-border);
    border-radius: 1.5rem;
    content: "";
  }

  html #d-splash::after {
    position: absolute;
    inset-block-start: var(--cj-shell-sidebar-top);
    inset-inline-start: var(--cj-shell-frame-start);
    box-sizing: border-box;
    width: 13.125rem;
    height: calc(
      var(--cj-shell-row-pitch) * (var(--cj-shell-sidebar-rows) - 1) +
        var(--cj-shell-row-h)
    );
    background:
      linear-gradient(var(--cj-initial-on-action) 0 0) 0 0 / 100%
        var(--cj-shell-row-h) no-repeat,
      /* An inactive row is the muted control fill, not --cj-initial-text: that
       * token is the label colour, and as a row fill it painted a white slab. */
      linear-gradient(var(--cj-initial-control) 0 0) 0
        var(--cj-shell-row-pitch) / 100% var(--cj-shell-row-h) no-repeat,
      radial-gradient(
          circle,
          var(--cj-initial-on-action) 0 0.35rem,
          transparent 0.38rem
        )
        1.15rem 1.12rem / 0.75rem 0.75rem no-repeat,
      radial-gradient(
          circle,
          var(--cj-initial-text-muted) 0 0.12rem,
          transparent 0.15rem
        )
        1.38rem 3.62rem / 0.3rem 0.3rem no-repeat,
      radial-gradient(
          circle,
          var(--cj-initial-text-muted) 0 0.12rem,
          transparent 0.15rem
        )
        1.38rem 4.04rem / 0.3rem 0.3rem no-repeat,
      radial-gradient(
          circle,
          var(--cj-initial-text-muted) 0 0.12rem,
          transparent 0.15rem
        )
        1.38rem 4.46rem / 0.3rem 0.3rem no-repeat,
      linear-gradient(var(--cj-initial-action) 0 0) 0 0 / 100% 2.25rem no-repeat,
      linear-gradient(var(--cj-initial-control) 0 0) 0 3rem / 100% 2.25rem
        no-repeat;
    background-clip:
      text, border-box, border-box, border-box, border-box, border-box,
      border-box;
    background-origin: border-box;
    border-radius: 0.5rem;
    color: transparent;
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 3rem;
    padding-inline: 3rem 1rem;
    white-space: pre;
    content: var(--cj-shell-topics) "\A" var(--cj-shell-more);
  }

  html #d-splash .preloader-image {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    margin: 0;
    transform: none;
  }

  html #d-splash .preloader-image::before {
    position: absolute;
    inset-block-start: calc(
      var(--cj-shell-sidebar-top) + var(--cj-shell-row-pitch) *
        var(--cj-shell-sidebar-rows) + 0.75rem
    );
    inset-inline-start: var(--cj-shell-frame-start);
    box-sizing: border-box;
    width: 13.125rem;
    height: 12rem;
    padding-inline: 1rem;
    color: transparent;
    background: linear-gradient(
      to bottom,
      var(--cj-initial-text-muted) 0 3rem,
      var(--cj-initial-text) 3rem 12rem
    );
    background-clip: text;
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 3rem;
    white-space: pre;
    content: var(--cj-shell-section-categories) "\A        "
      var(--cj-shell-general) "\A        " var(--cj-shell-feedback) "\A        "
      var(--cj-shell-all-categories);
  }

  html #d-splash .preloader-image::after {
    position: absolute;
    inset-block-start: var(--cj-shell-content-top);
    inset-inline: var(--cj-shell-main-start) var(--cj-shell-frame-start);
    height: calc(100dvh - var(--cj-shell-content-top));
    min-height: 24rem;
    background:
      radial-gradient(
          circle at center 1rem,
          var(--cj-initial-control) 0 0.95rem,
          transparent 1rem
        )
        1rem 1rem / 2rem var(--cj-shell-card-pitch) repeat-y,
      linear-gradient(
          to bottom,
          var(--cj-initial-control) 0 0.65rem,
          transparent 0.65rem
        )
        4rem 1.35rem / 9rem var(--cj-shell-card-pitch) repeat-y,
      linear-gradient(
          to bottom,
          var(--cj-initial-control) 0 1rem,
          transparent 1rem
        )
        1rem 3.75rem / 62% var(--cj-shell-card-pitch) repeat-y,
      linear-gradient(
          to bottom,
          var(--cj-initial-control) 0 0.65rem,
          transparent 0.65rem
        )
        1rem 5.5rem / 80% var(--cj-shell-card-pitch) repeat-y,
      linear-gradient(
          to bottom,
          var(--cj-initial-control) 0 0.65rem,
          transparent 0.65rem
        )
        1rem 6.75rem / 55% var(--cj-shell-card-pitch) repeat-y,
      linear-gradient(
          to bottom,
          var(--cj-initial-control) 0 0.55rem,
          transparent 0.55rem
