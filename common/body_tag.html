<!--
  First-paint skeleton. Styles live in scss/_splash.scss; this is only the
  shape. Labels come from custom properties there, so one locale table serves
  every string and there is nothing to translate here.

  The inline rule below is the only style that must not wait for the theme
  stylesheet: without it, a page that somehow renders before that stylesheet
  arrives would show this markup as a stack of bare text. _splash.scss turns it
  back on with `html body:has(#d-splash)`, which outweighs this selector, so the
  skeleton is up exactly while core's own splash is.
-->
<style>
  #cj-splash {
    display: none;

</style>
